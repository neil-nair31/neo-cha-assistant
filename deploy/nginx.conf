# Front door for Neo client demo (single public origin)
# Site static files in /usr/share/nginx/html (built Neo React site)
# Portal UI is served by the portal container under /app/

upstream assist { server assist:8787; }
upstream hs { server hs:8790; }
upstream digest { server digest:8791; }
upstream portal { server portal:8792; }

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  # --- Pragma Flow APIs (same paths the Vite site uses in local dev) ---
  location /api/assistant/ {
    proxy_pass http://assist/api/assistant/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /api/hs/ {
    rewrite ^/api/hs/(.*)$ /api/$1 break;
    proxy_pass http://hs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /api/notifications/ {
    rewrite ^/api/notifications/(.*)$ /api/$1 break;
    proxy_pass http://digest;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Client portal API + UI (UI built into portal image)
  location /api/ {
    proxy_pass http://portal/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /app/ {
    proxy_pass http://portal/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /app {
    return 302 /app/;
  }

  # Neo marketing / tools UI (static build)
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
